# Konfigurasi tool — bukan package build (aplikasi dijalankan via cli.py / ui/main.py)
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["openpyxl.*"]
ignore_missing_imports = true
